appId: com.ecg.leitorecg
---
- launchApp:
    clearState: true
- assertVisible: "ECG Reader"
- takeScreenshot: 01_login_screen
- tapOn: "Username"
- inputText: "qa-mobile@ecg.local"
- tapOn: "Password"
- inputText: ${MAESTRO_QA_PASSWORD}
- tapOn: "Sign in"
- assertVisible: "Exams"
- takeScreenshot: 02_exams_screen
- tapOn: "New exam"
- assertVisible: "Patient name"
- takeScreenshot: 03_new_exam
