appId: com.ecg.leitorecg
---
- launchApp:
    clearState: true
- assertVisible: "Leitor ECG"
- takeScreenshot: 01_login_screen
- tapOn: "Username"
- inputText: "qa-mobile@ecg.local"
- tapOn: "Password"
- inputText: ${MAESTRO_QA_PASSWORD}
- tapOn: "Sign in"
- assertVisible: "Upload de ECG"
- takeScreenshot: 02_upload_screen
- tapOn: "Escolher da galeria"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "10%,20%"
- assertVisible: "Enviar"
- takeScreenshot: 03_preview
- tapOn: "Enviar"
- assertVisible: "Confirmar envio"
- takeScreenshot: 04_review
- tapOn: "Confirmar envio"
- assertVisible: "Obrigado!"
- takeScreenshot: 05_done