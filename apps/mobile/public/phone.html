<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ECG Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 25%, #f4f5f7 0%, #d9dce0 55%, #b9bdc3 100%);
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  .stage { transform-origin: center; transition: transform .45s ease; }
  .phone, .screen { transition: width .45s ease, height .45s ease; }
  .island { transition: all .45s ease; }
  /* Landscape: the app asks for it while an ECG is shown full screen. */
  .landscape .phone, .landscape .screen { width: 844px; height: 390px; }
  .landscape .island { top: 50%; left: 11px; transform: translateY(-50%); width: 34px; height: 120px; }
  .landscape .home { bottom: 6px; }
  .landscape .phone::before, .landscape .phone::after, .landscape .btn-l, .landscape .btn-r { display: none; }
  .phone {
    position: relative; width: 390px; height: 844px; padding: 14px;
    box-sizing: content-box; border-radius: 68px;
    background: linear-gradient(145deg, #4a4d4b, #151716 40%, #3a3d3b);
    box-shadow: 0 0 0 2px #6b6e6c inset, 0 0 0 5px #0a0b0a, 0 40px 90px rgba(0,0,0,.65);
  }
  .phone::before, .phone::after, .btn-l, .btn-r {
    content: ""; position: absolute; background: #2a2c2b; border-radius: 3px;
  }
  .phone::before { left: -6px; top: 150px; width: 4px; height: 56px; }
  .phone::after  { left: -6px; top: 230px; width: 4px; height: 56px; }
  .btn-r { right: -6px; top: 200px; width: 4px; height: 96px; }
  .btn-l { left: -6px; top: 100px; width: 4px; height: 28px; }
  .screen {
    position: relative; width: 390px; height: 844px; overflow: hidden;
    border-radius: 54px; background: #fff;
  }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 3;
    pointer-events: none;
  }
  .home {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.85);
    z-index: 3; pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phone">
    <span class="btn-l"></span><span class="btn-r"></span>
    <div class="screen">
      <div class="island"></div>
      <iframe id="app" src="/" title="ECG Reader app" allow="camera; microphone; clipboard-write"></iframe>
      <div class="home"></div>
    </div>
  </div>
</div>
<script>
  // Scale the phone to fit short windows.
  function fit() {
    var land = document.body.classList.contains("landscape");
    var w = land ? 900 : 446, h = land ? 446 : 900;
    var s = Math.min(1, (window.innerHeight - 24) / h, (window.innerWidth - 24) / w);
    document.getElementById("stage").style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit); fit();
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "ecg-reader:orientation") return;
    document.body.classList.toggle("landscape", d.value === "landscape");
    fit();
  });
</script>
<script>var q=new URLSearchParams(location.search).get("app");if(q)document.getElementById("app").src=q;</script>
</body>
</html>
