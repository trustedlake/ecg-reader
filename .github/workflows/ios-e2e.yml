# iOS E2E via Maestro (iOS Simulator, production backend)
#
# Runner: macos-26 (arm64) with Xcode 26.6, required by Expo SDK 57
# (Xcode 26.4+). Xcode 26.3 (the last one in the macos-15 image) breaks with
# "abs(milliseconds) ambiguous" in expo-modules-jsi (Swift 6.2 / C++ interop).
#
# WARNING: before the first run, create the secret in GitHub
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#   Name: QA_MOBILE_PASSWORD
#   Value: the password of the test account qa-mobile@ecg.local (QA Mobile CI)
# Without this secret, the Maestro flow login fails.
#
# Run manually: Actions -> "iOS E2E (Maestro)" -> Run workflow.

name: iOS E2E (Maestro)

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/ios-e2e.yml"
  workflow_dispatch:

jobs:
  ios-e2e:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE_URL: https://d1i155fprtk4at.cloudfront.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache React Native prebuilt artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ runner.os }}-rn-artifacts-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-rn-artifacts-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios

      - name: Build app for iOS Simulator (no code signing)
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          if ! xcodebuild -list -workspace "$WORKSPACE" -json | grep -q "\"$SCHEME\""; then
            echo "ERROR: scheme '$SCHEME' not found in workspace $WORKSPACE" >&2
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          xcrun simctl bootstatus "iPhone 17 Pro" -b

      - name: Add fixture photo to Simulator library
        run: xcrun simctl addmedia booted apps/mobile/e2e/fixtures/sample-ecg.jpg

      - name: Install app on Simulator
        run: |
          APP_PATH=$(find apps/mobile/ios/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          xcrun simctl install booted "$APP_PATH"

      - name: Pre-grant photo library permission
        run: xcrun simctl privacy booted grant photos com.ecgreader.app

      - name: Launch app on Simulator
        run: xcrun simctl launch booted com.ecgreader.app

      - name: Run Maestro flow (login + upload)
        run: maestro test apps/mobile/e2e/login_and_upload.yaml -e MAESTRO_QA_PASSWORD="${{ secrets.QA_MOBILE_PASSWORD }}"

      - name: Collect Maestro artifacts (screenshots)
        if: always()
        run: |
          mkdir -p e2e-artifacts
          cp -R "$HOME/.maestro/tests" e2e-artifacts/ || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: e2e-artifacts/**
          if-no-files-found: warn